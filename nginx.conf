# Reverse proxy for contribution-proof. Add to the VPS nginx config and reload.
#
# The long timeouts are not padding: Bright Data collection is measured at 85-140 seconds
# and the analysis route holds the connection while it triggers. A default 60s proxy timeout
# would cut the first request of every cold analysis.

server {
    server_name proof.contentdao.app;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The rate limiter hashes this. Without it every visitor shares one bucket.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_send_timeout   180s;
        proxy_read_timeout   180s;
    }

    listen 443 ssl;
    # certbot fills in the certificate lines here.
}

server {
    listen 80;
    server_name proof.contentdao.app;
    return 301 https://$host$request_uri;
}
